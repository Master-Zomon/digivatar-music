<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digivatarea · Digivatar</title>
  <meta name="description" content="Digivatarea by Digivatar. Listen, download, and use it in your own creative work with credit (CC BY 4.0).">
  <meta property="og:title" content="Digivatarea · Digivatar">
  <meta property="og:description" content="Listen and download. Free to use with credit. CC BY 4.0.">
  <meta property="og:image" content="https://master-zomon.github.io/digivatar-music/digivatar_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <style>
    /* ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  C O L O R S  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
       Deep navy night, the logo's magenta glow, one green for the action. */
    :root {
      --ground: #0A0916;           /* the night behind everything */
      --glass: #13142F;            /* the card the song sits on */
      --edge: #2A2A55;             /* the card's hairline */
      --cream: #E9E4CF;            /* the title */
      --green: #3FD08A;            /* the download button and links */
      --soft: #9A9BB5;             /* quiet text */
      --magenta: #FF2BD6;          /* the logo's glow: the footer's light */
      --pink: #FF006F;             /* focus rings */
      --mark-a: #F8A300;           /* Digivatar's three squares, left to right */
      --mark-b: #00F8D2;
      --mark-c: #F80069;
      --pixel: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    /* ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  P A G E  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
       Logo, song, footer, in one column down the middle. */
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ground); color: var(--cream); }
    body { display: grid; place-items: center; min-height: 100vh; font-family: var(--mono); font-size: 16px; line-height: 1.6; }
    main { width: 100%; max-width: 560px; padding: 32px 16px; }   /* 560: a player wide enough to scrub easily; 16: the phone gutter */
    a { color: var(--green); }
    a:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

    /* ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  L O G O  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
       The Digivatar tag, glowing above the song. */
    .logo { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto 16px; }   /* 360: the tag reads at a glance without crowding the card */

    /* ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  S O N G  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
       Listen, then take it. */
    .song { padding: 24px 20px; background: var(--glass); border: 1px solid var(--edge); }
    .song h1 { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 1.8rem; line-height: 1.2; }
    .artist { margin: 4px 0 20px; color: var(--soft); }
    audio { display: block; width: 100%; margin-bottom: 16px; }
    .download {
      display: flex; align-items: center; justify-content: center;
      min-height: 48px;                                      /* 48: a comfortable thumb target on a phone */
      font: 600 1rem var(--mono);
      text-decoration: none;
      color: var(--ground); background: var(--green);
    }
    .download:hover { filter: brightness(1.1); }
    .credit { margin: 16px 0 0; color: var(--soft); font-size: 0.85rem; }

    /* ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  F O O T E R  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
       A skyline of separate light bars that dances to the song while it plays and lies flat when it stops. Then the mark and the welcome. */
    .site-foot { margin-top: 40px; text-align: center; }
    .skyline {
      display: block; width: 100%; height: 72px; margin: 0 auto;   /* 72: the tallest a bar can stand; centered when whole bars leave a sliver spare */
      image-rendering: pixelated;
      filter: drop-shadow(0 0 6px var(--magenta));           /* 6: the same soft glow the logo wears */
    }
    .horizon { height: 2px; margin: 0 0 24px; background: var(--magenta); box-shadow: 0 0 12px var(--magenta); }   /* the line the skyline stands on */
    .mark { display: inline-flex; margin-bottom: 14px; }
    .mark i { display: block; width: 12px; height: 12px; }   /* 12: the signature's squares, small and exact */
    .mark i:nth-child(1) { background: var(--mark-a); }
    .mark i:nth-child(2) { background: var(--mark-b); }
    .mark i:nth-child(3) { background: var(--mark-c); }
    .welcome { margin: 0 0 6px; font-family: var(--pixel); font-size: 1.05rem; letter-spacing: 0.04em; color: var(--cream); text-shadow: 0 0 10px var(--magenta); text-wrap: balance; }
    .fine { margin: 0; color: var(--soft); font-size: 0.8rem; }
    @media (prefers-reduced-motion: reduce) { .skyline { filter: none; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="digivatar_logo.png" width="730" height="443" alt="Digivatar">

    <section class="song" aria-labelledby="song-title">
      <h1 id="song-title">Digivatarea</h1>
      <p class="artist">Digivatar</p>
      <audio id="player" controls preload="metadata" src="digivatar_digivatarea.mp3">
        Your browser can't play this here. Use the download button below.
      </audio>
      <a class="download" id="download" href="digivatar_digivatarea.mp3" download="Digivatar - Digivatarea.mp3">Download MP3</a>
      <p class="credit">Free to use in your own work. Credit: "Digivatarea" by Digivatar, <a href="https://creativecommons.org/licenses/by/4.0/" rel="license noopener" target="_blank">CC BY 4.0</a>.</p>
    </section>

    <footer class="site-foot">
      <canvas class="skyline" id="skyline" aria-hidden="true"></canvas>
      <div class="horizon" aria-hidden="true"></div>
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="welcome">Welcome to Digivatarea, land of the creative heart.</p>
      <p class="fine">© <span id="year">2026</span> Digivatar · Music free to use under CC&nbsp;BY&nbsp;4.0</p>
    </footer>
  </main>

  <script>
  (() => {
    'use strict';

    // ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  S I G N A T U R E  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
    //
    //   Digivatar · free music
    //   One song to play and download, free to use under CC BY 4.0, under the Digivatar tag, with a footer that dances to it.
    //   Built for Alexander Mora (Digivatar) · 2026-11-02 · Digivatarea · logo and pixel skyline footer added
    //

    const player = document.getElementById('player');
    const download = document.getElementById('download');
    const canvas = document.getElementById('skyline');
    const yearSpot = document.getElementById('year');

    // ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  F A L L B A C K  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
    // If the player cannot load the file, say so and point to the download, so nobody is left with a dead player.
    if (player && download) {
      player.addEventListener('error', () => {
        download.textContent = 'Download MP3 (the player could not load it)';
      });
    }
    if (yearSpot) { yearSpot.textContent = String(new Date().getFullYear()); }   // the copyright year keeps itself current

    // ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  S K Y L I N E  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
    // Separate bars of light along the horizon. While the song plays they are its real spectrum, low notes on the left.
    // When it stops they fall back to a flat line and wait.
    const pen = canvas && typeof canvas.getContext === 'function' ? canvas.getContext('2d') : null;
    if (!pen || !player) { return; }                           // no canvas: the footer still reads without its light

    const PITCH = 5;                                           // CSS pixels from one bar to the next
    const BAR = 3;                                             // CSS pixels wide each bar is: two dark pixels between bars, so every bar stands alone
    const TALL = 72;                                           // CSS pixels from the horizon to the top of the strip, matching the canvas's height in the CSS
    const FLAT = 2;                                            // CSS pixels every bar keeps when nothing plays: the flat line
    const CAP = 2;                                             // CSS pixels of white burning at the top of a bar that is moving, like the logo's core
    const FALL = 0.06;                                         // share of the strip a bar can drop per frame: up fast, down slow, the way a meter falls
    const FFT_SIZE = 2048;                                     // 1024 frequency bins, about 23 Hz apart at 48 kHz: fine enough to give the bass its own bars
    const LOW_HZ = 40;                                         // the strip starts at the kick drum's floor,
    const HIGH_HZ = 16000;                                     // and ends where the air on the cymbals runs out
    const MIN_DB = -100;                                       // quieter than this reads as an empty bar,
    const MAX_DB = -25;                                        // and only this loud lights a bar to the top, so a full mix still leaves headroom
    const CURVE = 1.25;                                        // above 1 pulls the middle down a little, so the beat stands up out of the mix instead of a flat wall
    const TILT = 0.9;                                          // highs carry less energy than lows: lift the right end by up to 90%, the way a studio analyzer tilts
    const SMOOTHING = 0.7;                                     // the analyser's own smoothing, so the bars move like light, not noise
    const token = (name, fallback) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
    const colors = {                                           // read from the page's own tokens, with fallbacks if a token is missing
      body: token('--magenta', '#FF2BD6'),
      peak: token('--cream', '#E9E4CF'),
      ghost: 'rgba(255, 43, 214, 0.1)',                        // the unlit length of a bar: a faint trace of the magenta, so the instrument shows at rest
    };
    const reduceMotion = Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    let columns = 0;
    let heights = new Float32Array(0);                         // each bar's height now, 0 to 1 of the strip
    let ratio = 1;
    let analyser = null;
    let bins = null;
    let rate = 48000;                                          // the audio's sample rate in hertz; the real one is read once the song is hooked up
    let bands = null;                                          // for each bar, the first and last bin it averages, spaced by octaves like a real EQ

    // ---- size: whole bars, whole device pixels ----
    const fit = () => {
      ratio = Math.max(1, Math.round(window.devicePixelRatio || 1));
      const width = canvas.clientWidth || 1;
      columns = Math.max(1, Math.floor((width + PITCH - BAR) / PITCH));   // as many whole bars as fit, the last one without a gap after it
      canvas.width = ((columns - 1) * PITCH + BAR) * ratio;
      canvas.height = TALL * ratio;
      canvas.style.width = ((columns - 1) * PITCH + BAR) + 'px';
      const kept = heights;
      heights = new Float32Array(columns);
      heights.set(kept.subarray(0, Math.min(kept.length, columns)));
      bands = null;                                            // the bars changed: their frequency ranges are worked out again
      draw();
    };

    // ---- the song's spectrum, hooked up the first time it plays (a browser only allows sound to start from a tap) ----
    const bandsFor = () => {
      const hzPerBin = rate / 2 / bins.length;
      const octaves = Math.log2(HIGH_HZ / LOW_HZ);
      return Array.from({ length: columns }, (unused, column) => {
        const from = LOW_HZ * Math.pow(2, octaves * column / columns);
        const to = LOW_HZ * Math.pow(2, octaves * (column + 1) / columns);
        const first = Math.min(bins.length - 1, Math.floor(from / hzPerBin));
        return [first, Math.max(first, Math.min(bins.length - 1, Math.floor(to / hzPerBin)))];
      });
    };
    const listen = () => {
      if (analyser || reduceMotion) { return; }                // already listening, or asked for no motion: the line stays flat
      const Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) { return; }                                // no Web Audio: the song plays, the line stays flat
      try {
        const context = new Context();
        const source = context.createMediaElementSource(player);
        analyser = context.createAnalyser();
        analyser.fftSize = FFT_SIZE;
        analyser.minDecibels = MIN_DB;
        analyser.maxDecibels = MAX_DB;
        analyser.smoothingTimeConstant = SMOOTHING;
        rate = context.sampleRate || rate;
        source.connect(analyser);
        analyser.connect(context.destination);
        bins = new Uint8Array(analyser.frequencyBinCount);
        if (context.state === 'suspended') { context.resume().catch(() => {}); }
      } catch (error) {
        analyser = null;                                       // could not hook the player: the song still plays, the line stays flat
      }
    };

    // ---- one frame ----
    const levelOf = (column) => {                              // how tall a bar wants to be right now, 0 to 1
      const [first, last] = bands[column];
      let sum = 0;
      for (let bin = first; bin <= last; bin += 1) { sum += bins[bin]; }
      const level = sum / (last - first + 1) / 255;           // 255: the loudest a bin can read
      return Math.min(1, Math.pow(level, CURVE) * (1 + TILT * column / columns));
    };
    const draw = () => {
      const live = Boolean(analyser && bins) && !player.paused;
      if (live) {
        analyser.getByteFrequencyData(bins);                  // the spectrum, read once a frame
        if (!bands || bands.length !== columns) { bands = bandsFor(); }
      }
      const step = PITCH * ratio;                             // in device pixels, so every bar lands on whole pixels
      const wide = BAR * ratio;
      const full = TALL * ratio;
      const flat = FLAT * ratio;
      const cap = CAP * ratio;
      let moving = false;
      pen.clearRect(0, 0, canvas.width, canvas.height);
      for (let column = 0; column < columns; column += 1) {
        const wanted = live ? levelOf(column) : 0;
        heights[column] = wanted > heights[column] ? wanted : Math.max(wanted, heights[column] - FALL);
        if (heights[column] > 0) { moving = true; }           // still on its way down to the line: keep drawing
        const height = Math.max(flat, Math.round(heights[column] * full));   // whole device pixels, and never below the flat line
        const x = column * step;
        pen.fillStyle = colors.ghost;
        pen.fillRect(x, 0, wide, full - height);
        pen.fillStyle = colors.body;
        pen.fillRect(x, full - height, wide, height);
        if (height > flat + cap) {                             // only a bar that has risen gets its white tip
          pen.fillStyle = colors.peak;
          pen.fillRect(x, full - height, wide, cap);
        }
      }
      return live || moving;                                   // whether another frame is needed
    };

    // ---- the clock: runs while the song plays and while the bars fall back, then rests ----
    let running = false;
    const tick = () => {
      if (draw()) { window.requestAnimationFrame(tick); return; }
      running = false;
    };
    const wake = () => {
      if (running) { return; }
      running = true;
      window.requestAnimationFrame(tick);
    };
    player.addEventListener('play', () => { listen(); wake(); });
    player.addEventListener('pause', wake);                   // let the bars fall to the line
    player.addEventListener('ended', wake);
    window.addEventListener('resize', fit);
    fit();
  })();
  </script>
</body>
</html>
